openapi: 3.1.1
info:
  title: Email API
  version: 1.0.0
  description: |
    API contract for the web mail system of the semester project.

    ## Scope and assumptions

    * The contract is designed from the client's perspective. Database tables, storage folders, and
      framework classes are implementation details and are not visible here.
    * The current user is already identified (JWT bearer token). Registration, login, user
      administration, and receiving external email are out of scope of this contract.
    * A user can only see and change their own emails and attachments. A resource that belongs to
      another user is reported exactly like a resource that does not exist (`404 Not Found`), so the
      API never reveals whether a foreign resource exists.

    ## Conventions

    * **Identifiers** are UUIDs generated by the server.
    * **Date-times** are RFC 3339 date-times with an explicit UTC offset of the server's local time
      zone, for example `2026-11-06T09:15:00+01:00`. An unset `sentAt` is represented by an explicit
      `null`.
    * **Request and response bodies** are JSON (`application/json`), errors are
      `application/problem+json`, attachment content is binary.
    * **Writable and server-controlled data:** Clients can only write `from`, `to`, `cc`, `bcc`,
      `replyTo`, `subject`, and `content`. `id`, `createdAt`, `updatedAt`, `sentAt`, `status`,
      `source`, and `attachments` are controlled by the server. A request that contains any of them
      (or any other unknown property) is rejected with `422 Unprocessable Entity`; it is never
      silently ignored.
    * **Omitted, empty, and null values:** Optional recipient lists that are omitted are treated as
      empty lists. Empty lists are allowed as long as at least one of `to`, `cc`, `bcc` is not
      empty. Explicit `null` is never accepted in requests (`422`).
    * **Updates** use `PUT` with the complete writable representation. Properties that are omitted
      are reset to their empty value. `PATCH` is not supported (`405`).
    * **Unsupported HTTP methods** on an existing path are answered with `405 Method Not Allowed`
      and an `Allow` header that lists the supported methods.

    ## Error policy

    | Status | Meaning in this API |
    |---|---|
    | 400 | The request cannot be understood: malformed JSON, invalid query parameter (pagination or filter). |
    | 401 | Missing or invalid token. |
    | 404 | Unknown resource, or a resource of another user. |
    | 405 | HTTP method not supported for the path. |
    | 409 | The request is valid but conflicts with the current state, for example the email is already sent. |
    | 413 | An uploaded file or the attachments of an email exceed the size limit. |
    | 415 | Unsupported request media type. |
    | 422 | The request is well-formed JSON but violates the schema or a business rule. |
    | 500 | Unexpected error in the server. The response never exposes internal details such as stack traces. |

    ## Processing model of sending

    Sending is **synchronous**. `POST /emails/{emailId}/transmissions` performs one transmission
    attempt and answers when the attempt is finished. A rejected request (for example, an already
    sent email) never starts an attempt. An accepted attempt that fails is still a successful HTTP
    exchange (`201 Created`) whose transmission has the outcome `failed`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: Emails
    description: Create, read, update, and delete emails.
  - name: Transmissions
    description: Send an email. Each send attempt is a transmission resource.
  - name: Attachments
    description: Upload, inspect, download, and delete attachments of an email.
paths:
  /emails:
    description: |
      The collection of emails of the current user.
      Other HTTP methods are answered with `405` and `Allow: GET, POST`.
    get:
      tags: [Emails]
      operationId: listEmails
      summary: List a page of email summaries
      description: |
        Returns one page of email summaries of the current user. The default ordering is
        `createdAt` descending with the email `id` ascending as tie-breaker, so successive pages
        never repeat or skip emails while no email is created or deleted in between.

        Filters are combined with AND and are applied before pagination, so `totalElements` and
        `totalPages` describe the filtered result. A page that is beyond the last page, or a
        filter without matches, returns `200` with an empty `data` array.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SourceFilter'
      responses:
        '200':
          description: One page of email summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPage'
              examples:
                firstPage:
                  summary: "GET /emails (first page, default size 20)"
                  value:
                    data:
                      - id: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                        from: alex.becker@mni.thm.de
                        subject: Project report
                        status: draft
                        source: intern
                        createdAt: '2026-11-06T09:15:00+01:00'
                        updatedAt: '2026-11-06T09:15:00+01:00'
                        sentAt: null
                        attachmentCount: 2
                      - id: 9b7e4d2a-1c3f-4a58-8e6d-5f0a2b9c7d31
                        from: mira.kaya@mni.thm.de
                        subject: Lecture notes
                        status: sent
                        source: extern
                        createdAt: '2026-11-05T17:40:00+01:00'
                        updatedAt: '2026-11-05T17:40:00+01:00'
                        sentAt: '2026-11-05T17:40:00+01:00'
                        attachmentCount: 0
                    page: 0
                    size: 20
                    totalElements: 2
                    totalPages: 1
                draftsPage:
                  summary: "GET /emails?status=draft&page=0&size=10 (page of drafts)"
                  value:
                    data:
                      - id: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                        from: alex.becker@mni.thm.de
                        subject: Project report
                        status: draft
                        source: intern
                        createdAt: '2026-11-06T09:15:00+01:00'
                        updatedAt: '2026-11-06T09:15:00+01:00'
                        sentAt: null
                        attachmentCount: 2
                    page: 0
                    size: 10
                    totalElements: 1
                    totalPages: 1
                externEmailsPage:
                  summary: "GET /emails?source=extern&page=0&size=10 (page of received emails)"
                  value:
                    data:
                      - id: 9b7e4d2a-1c3f-4a58-8e6d-5f0a2b9c7d31
                        from: mira.kaya@mni.thm.de
                        subject: Lecture notes
                        status: sent
                        source: extern
                        createdAt: '2026-11-05T17:40:00+01:00'
                        updatedAt: '2026-11-05T17:40:00+01:00'
                        sentAt: '2026-11-05T17:40:00+01:00'
                        attachmentCount: 0
                    page: 0
                    size: 10
                    totalElements: 1
                    totalPages: 1
                emptyResult:
                  summary: "GET /emails?status=error (no matches)"
                  value:
                    data: []
                    page: 0
                    size: 20
                    totalElements: 0
                    totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Emails]
      operationId: createEmail
      summary: Create an email as draft
      description: |
        Creates a new email with the status `draft` and the source `intern`. At least one valid
        address must be given in `to`, `cc`, or `bcc`; `subject` and `content` must not be blank.
        `from` is optional: if it is omitted the server uses the address of the current user,
        if it is given it must equal that address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCreate'
            examples:
              onlyCc:
                summary: Only Cc recipients
                value:
                  cc: [mira.kaya@mni.thm.de]
                  subject: Project report
                  content: Hi Mira, the report is attached soon.
              onlyBcc:
                summary: Only Bcc recipients
                value:
                  bcc: [mira.kaya@mni.thm.de, jonas.weber@mni.thm.de]
                  replyTo: [alex.becker@mni.thm.de]
                  subject: Project report
                  content: Hi all, the report is attached soon.
      responses:
        '201':
          description: The draft was created. The `Location` header identifies the new email.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
              examples:
                createdDraft:
                  summary: Draft created from the `onlyCc` request
                  value:
                    id: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                    from: alex.becker@mni.thm.de
                    to: []
                    cc: [mira.kaya@mni.thm.de]
                    bcc: []
                    replyTo: []
                    subject: Project report
                    content: Hi Mira, the report is attached soon.
                    status: draft
                    source: intern
                    createdAt: '2026-11-06T09:15:00+01:00'
                    updatedAt: '2026-11-06T09:15:00+01:00'
                    sentAt: null
                    attachments: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}:
    description: |
      A single email of the current user.
      Other HTTP methods (for example `PATCH`) are answered with `405` and
      `Allow: GET, PUT, DELETE`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      tags: [Emails]
      operationId: getEmail
      summary: Read one email in detail
      description: Returns all data of the email, including metadata and attachment metadata.
      responses:
        '200':
          description: The detailed email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
              examples:
                draftWithTwoAttachments:
                  summary: Draft with two attachments
                  value:
                    id: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                    from: alex.becker@mni.thm.de
                    to: [mira.kaya@mni.thm.de]
                    cc: []
                    bcc: []
                    replyTo: [alex.becker@mni.thm.de]
                    subject: Project report
                    content: Hi Mira, please find the report and the figures attached.
                    status: draft
                    source: intern
                    createdAt: '2026-11-06T09:15:00+01:00'
                    updatedAt: '2026-11-06T09:20:00+01:00'
                    sentAt: null
                    attachments:
                      - id: b1c2d3e4-f5a6-4b7c-8d9e-0a1b2c3d4e5f
                        fileName: report.pdf
                        mimeType: application/pdf
                        size: 482133
                      - id: c2d3e4f5-a6b7-4c8d-9e0f-1b2c3d4e5f6a
                        fileName: figures.png
                        mimeType: image/png
                        size: 120554
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Emails]
      operationId: updateEmail
      summary: Replace the writable data of an email
      description: |
        Replaces `from`, `to`, `cc`, `bcc`, `replyTo`, `subject`, and `content` with the given
        representation. The representation must satisfy the same rules as an email creation, so an
        update can never produce an email without recipients. Attachments are managed through their
        own resources. The server sets `updatedAt` to the time of the update.

        An email with the status `sent` is read-only (`409`). An email with the status `error` can
        be edited. Repeating the same request leaves the email in the same state (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUpdate'
            examples:
              replaceRecipients:
                summary: Move all recipients to Bcc and change the subject
                value:
                  bcc: [mira.kaya@mni.thm.de, jonas.weber@mni.thm.de]
                  subject: Final project report
                  content: Hi all, please find the final report attached.
      responses:
        '200':
          description: The updated email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Emails]
      operationId: deleteEmail
      summary: Delete an email permanently
      description: |
        Permanently removes the email and all its attachments, regardless of its status. Repeating
        the request has the same effect on the server (the email stays deleted), although the
        repeated request is answered with `404`.
      responses:
        '204':
          description: The email and its attachments were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}/transmissions:
    description: |
      The send attempts of one email. Other HTTP methods are answered with `405` and
      `Allow: GET, POST`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      tags: [Transmissions]
      operationId: listTransmissions
      summary: List the send attempts of an email
      description: Returns all transmissions of the email, the newest first.
      responses:
        '200':
          description: The transmissions of the email.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Transmissions]
      operationId: createTransmission
      summary: Send an email (create a transmission)
      description: |
        Performs one synchronous transmission attempt for an email with the status `draft` or
        `error`. The request has no body.

        **Effects**

        | Outcome | `status` | `sentAt` | `updatedAt` |
        |---|---|---|---|
        | `succeeded` | `sent` | time of the attempt | time of the attempt |
        | `failed` | `error` | stays unset | time of the attempt |

        **Rejected requests** do not start an attempt and change nothing: an email with the status
        `sent`, or a received email (`source` is `extern`), answers `409`. An email with the status
        `error` can be edited and sent again.

        **Retry policy:** `POST` is not idempotent by definition, but this operation protects
        itself: after a successful attempt the email is `sent`, so a repeated request is rejected
        with `409` and cannot send the email twice. If a request times out, the client first reads
        `GET /emails/{emailId}/transmissions` (or the email) to learn the outcome and only repeats
        the request if the email is still `draft` or `error`. The server processes transmissions of
        one email one after another.
      responses:
        '201':
          description: |
            The transmission attempt was performed. The `Location` header identifies the
            transmission. Check `outcome`, because a failed attempt is also answered with `201`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transmission'
              examples:
                succeeded:
                  summary: Successful transmission
                  value:
                    id: d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f7a
                    emailId: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                    outcome: succeeded
                    attemptedAt: '2026-11-06T09:30:00+01:00'
                    failureReason: null
                failed:
                  summary: Accepted attempt that failed (the email is now in status error)
                  value:
                    id: e5f6a7b8-c9d0-4e1f-9a2b-3c4d5e6f7a8b
                    emailId: 3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
                    outcome: failed
                    attemptedAt: '2026-11-06T09:31:00+01:00'
                    failureReason: The mail server did not accept the message.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}/transmissions/{transmissionId}:
    description: |
      One send attempt. Other HTTP methods are answered with `405` and `Allow: GET`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
      - $ref: '#/components/parameters/TransmissionId'
    get:
      tags: [Transmissions]
      operationId: getTransmission
      summary: Read one send attempt
      responses:
        '200':
          description: The transmission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}/attachments:
    description: |
      The attachments of one email. Other HTTP methods are answered with `405` and
      `Allow: GET, POST`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
    get:
      tags: [Attachments]
      operationId: listAttachments
      summary: List the attachment metadata of an email
      responses:
        '200':
          description: The metadata of all attachments of the email (never the file content).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload one attachment
      description: |
        Uploads **one** file as `multipart/form-data` in the part named `file`. To attach several
        files the client repeats the request, once per file.

        The server reads the file name from the `Content-Disposition` header of the part, the MIME
        type from the `Content-Type` header of the part, and counts the bytes while it receives
        the file; the client does not send these values in a separate field.

        **Limits:** one file has at least 1 byte and at most 10 MB (10485760 bytes), all
        attachments of one email together at most 25 MB, and one email has at most 10
        attachments. Attachments can only be added to emails with the status `draft` or `error`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The file content. File name and MIME type come from the part headers.
            encoding:
              file:
                contentType: '*/*'
      responses:
        '201':
          description: The attachment was stored. The `Location` header identifies its metadata.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}/attachments/{attachmentId}:
    description: |
      The metadata of one attachment. Other HTTP methods (there is no update) are answered with
      `405` and `Allow: GET, DELETE`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachmentMetadata
      summary: Read the metadata of one attachment
      description: |
        The attachment must belong to the email in the path. Otherwise the answer is `404`, even if
        the attachment exists on another email.
      responses:
        '200':
          description: The attachment metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Delete one attachment
      description: |
        Deletes the attachment and its file. Attachments cannot be updated. To replace one, the
        client deletes it and uploads the new file. This is only possible while the email is
        `draft` or `error`; the attachments of a sent email are read-only.
      responses:
        '204':
          description: The attachment was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /emails/{emailId}/attachments/{attachmentId}/content:
    description: |
      The binary content of one attachment. Other HTTP methods are answered with `405` and
      `Allow: GET`.
    parameters:
      - $ref: '#/components/parameters/EmailId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: downloadAttachmentContent
      summary: Download the file of one attachment
      description: |
        Returns the bytes of the file. The `Content-Type` header carries the stored MIME type
        and `Content-Disposition` carries the file name, so the client needs no extra request
        for them. The metadata resource (`.../attachments/{attachmentId}`) and the content
        resource (`.../content`) are different representations of the same attachment.
      responses:
        '200':
          description: The file content.
          headers:
            Content-Type:
              description: The MIME type of the stored file, for example `application/pdf`.
              schema:
                type: string
            Content-Disposition:
              description: 'Always `attachment` with the original file name, for example `attachment; filename="report.pdf"`.'
              schema:
                type: string
            Content-Length:
              description: The size of the file in bytes.
              schema:
                type: integer
                format: int64
                minimum: 1
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The JWT of the current user.
  parameters:
    EmailId:
      name: emailId
      in: path
      required: true
      description: The identifier of the email.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: The identifier of the attachment.
      schema:
        type: string
        format: uuid
    TransmissionId:
      name: transmissionId
      in: path
      required: true
      description: The identifier of the transmission.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: The zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: The number of elements per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      required: false
      description: Only return emails with this status.
      schema:
        $ref: '#/components/schemas/EmailStatus'
    SourceFilter:
      name: source
      in: query
      required: false
      description: Only return emails with this source.
      schema:
        $ref: '#/components/schemas/EmailSource'
  headers:
    Location:
      description: The URI of the created resource.
      required: true
      schema:
        type: string
        format: uri-reference
      example: /api/v1/emails/3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
    Allow:
      description: The HTTP methods supported by the path.
      required: true
      schema:
        type: string
      example: GET, PUT, DELETE
  schemas:
    EmailAddress:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      example: mira.kaya@mni.thm.de
    RecipientList:
      type: array
      description: A list of email addresses without duplicates, at most 50 entries.
      maxItems: 50
      uniqueItems: true
      items:
        $ref: '#/components/schemas/EmailAddress'
    Subject:
      type: string
      description: The subject. At least one character that is not whitespace.
      minLength: 1
      maxLength: 255
      pattern: '\S'
    Content:
      type: string
      description: The plain-text message body. At least one character that is not whitespace.
      minLength: 1
      maxLength: 100000
      pattern: '\S'
    EmailStatus:
      type: string
      enum: [draft, sent, error]
    EmailSource:
      type: string
      description: "`extern` for received emails, `intern` for emails written in this system."
      enum: [intern, extern]
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 date-time with the UTC offset of the server's local time zone.
      example: '2026-11-06T09:15:00+01:00'
    EmailCreate:
      type: object
      description: |
        The writable data of a new email. At least one of `to`, `cc`, `bcc` must contain an address.
        Server-controlled properties are not part of this schema and are rejected.
      additionalProperties: false
      required: [subject, content]
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          $ref: '#/components/schemas/RecipientList'
        cc:
          $ref: '#/components/schemas/RecipientList'
        bcc:
          $ref: '#/components/schemas/RecipientList'
        replyTo:
          $ref: '#/components/schemas/RecipientList'
        subject:
          $ref: '#/components/schemas/Subject'
        content:
          $ref: '#/components/schemas/Content'
      anyOf:
        - required: [to]
          properties:
            to:
              minItems: 1
        - required: [cc]
          properties:
            cc:
              minItems: 1
        - required: [bcc]
          properties:
            bcc:
              minItems: 1
    EmailUpdate:
      type: object
      description: |
        The complete writable data of an existing email. It follows the same rules as `EmailCreate`.
        Omitted optional properties are reset to their empty value.
      additionalProperties: false
      required: [subject, content]
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          $ref: '#/components/schemas/RecipientList'
        cc:
          $ref: '#/components/schemas/RecipientList'
        bcc:
          $ref: '#/components/schemas/RecipientList'
        replyTo:
          $ref: '#/components/schemas/RecipientList'
        subject:
          $ref: '#/components/schemas/Subject'
        content:
          $ref: '#/components/schemas/Content'
      anyOf:
        - required: [to]
          properties:
            to:
              minItems: 1
        - required: [cc]
          properties:
            cc:
              minItems: 1
        - required: [bcc]
          properties:
            bcc:
              minItems: 1
    EmailSummary:
      type: object
      description: The short representation of an email in a mailbox overview. It has no content and no attachment metadata.
      required: [id, from, subject, status, source, createdAt, updatedAt, sentAt, attachmentCount]
      properties:
        id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
        status:
          $ref: '#/components/schemas/EmailStatus'
        source:
          $ref: '#/components/schemas/EmailSource'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        sentAt:
          description: The time of the successful transmission, `null` while the email was not sent.
          type: [string, 'null']
          format: date-time
        attachmentCount:
          type: integer
          minimum: 0
          maximum: 10
    EmailDetail:
      type: object
      description: All data of an email, including metadata and attachment metadata.
      required:
        - id
        - from
        - to
        - cc
        - bcc
        - replyTo
        - subject
        - content
        - status
        - source
        - createdAt
        - updatedAt
        - sentAt
        - attachments
      properties:
        id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          $ref: '#/components/schemas/RecipientList'
        cc:
          $ref: '#/components/schemas/RecipientList'
        bcc:
          $ref: '#/components/schemas/RecipientList'
        replyTo:
          $ref: '#/components/schemas/RecipientList'
        subject:
          type: string
        content:
          type: string
        status:
          $ref: '#/components/schemas/EmailStatus'
        source:
          $ref: '#/components/schemas/EmailSource'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        sentAt:
          description: The time of the successful transmission, `null` while the email was not sent.
          type: [string, 'null']
          format: date-time
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AttachmentMetadata'
    EmailPage:
      type: object
      description: One page of email summaries with the information to request further pages.
      required: [data, page, size, totalElements, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmailSummary'
        page:
          type: integer
          minimum: 0
          description: The zero-based number of this page.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: The requested page size.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: The number of emails that match the filters.
        totalPages:
          type: integer
          minimum: 0
          description: The number of pages. 0 if nothing matches.
    AttachmentMetadata:
      type: object
      description: The metadata of an attachment. The storage location is never exposed.
      required: [id, fileName, mimeType, size]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          example: report.pdf
        mimeType:
          type: string
          pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
          example: application/pdf
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: The size of the file in bytes.
    Transmission:
      type: object
      description: One attempt to send an email.
      required: [id, emailId, outcome, attemptedAt, failureReason]
      properties:
        id:
          type: string
          format: uuid
        emailId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [succeeded, failed]
        attemptedAt:
          $ref: '#/components/schemas/DateTime'
        failureReason:
          description: Why the attempt failed, `null` if it succeeded.
          type: [string, 'null']
          maxLength: 500
    FieldError:
      type: object
      required: [detail, pointer]
      properties:
        detail:
          type: string
        pointer:
          type: string
          description: A JSON Pointer to the invalid property, for example `/subject`.
    ProblemDetail:
      type: object
      description: The error representation of all error responses, based on RFC 9457.
      required: [title, status, detail, instance]
      properties:
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The path of the request that caused the error.
        errors:
          type: array
          description: Details per invalid property, present for validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: The request cannot be understood, for example malformed JSON or an invalid query parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            invalidQueryParameter:
              value:
                title: BadRequest
                status: 400
                detail: The query parameter 'size' must be between 1 and 100.
                instance: /api/v1/emails
    Unauthorized:
      description: The token is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The resource does not exist or belongs to another user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unknownEmail:
              value:
                title: NotFound
                status: 404
                detail: The email does not exist.
                instance: /api/v1/emails/3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
    MethodNotAllowed:
      description: The HTTP method is not supported for the path.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The request conflicts with the current state of the resource, for example the email is already sent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            emailAlreadySent:
              value:
                title: Conflict
                status: 409
                detail: The email was already sent and is read-only.
                instance: /api/v1/emails/3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10
    PayloadTooLarge:
      description: The file exceeds 10 MB or the attachments of the email exceed 25 MB together.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            fileTooLarge:
              value:
                title: PayloadTooLarge
                status: 413
                detail: The file is larger than 10485760 bytes.
                instance: /api/v1/emails/3f2b8c1e-5d4a-4e7b-9a61-2c8f0d7e1a10/attachments
    UnsupportedMediaType:
      description: The request media type is not supported. JSON bodies need `application/json`, uploads need `multipart/form-data`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: The request is well-formed but violates the schema or a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validationError:
              summary: No recipient and an empty subject
              value:
                title: UnprocessableEntity
                status: 422
                detail: The proposed content is syntactically correct but violates validation rules.
                instance: /api/v1/emails
                errors:
                  - detail: At least one recipient is required in to, cc, or bcc.
                    pointer: /to
                  - detail: Subject must not be blank.
                    pointer: /subject
    InternalServerError:
      description: An unexpected error occurred in the server. The body contains no internal details such as stack traces, SQL, or file paths.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unexpectedError:
              value:
                title: InternalServerError
                status: 500
                detail: An unexpected error occurred. Please try again later.
                instance: /api/v1/emails
