spring:
  application:
    name: MailBackend
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  tomcat:
    max-swallow-size: 100MB

mail:
  attachments:
    directory: data/attachments
